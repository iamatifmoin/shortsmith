services:
  postgres:
    image: postgres:16
    container_name: shortsmith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortsmith
      POSTGRES_PASSWORD: shortsmith
      POSTGRES_DB: shortsmith
    ports:
      - "5432:5432"
    volumes:
      - shortsmith-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortsmith"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: shortsmith-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - shortsmith-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shortsmith-pgdata:
  shortsmith-redisdata:
